query_creation_task:
  description: >
    Generate exactly 20 unique search queries for:

    "{user_query}"

    The queries should maximize search coverage while remaining strictly relevant.

    Do not search.
    Do not explain.
    Only generate queries.

  expected_output: >
    A list of exactly 20 search queries.
    
  agent: query_creator

data_scraping_task:
  description: >
    Use the generated search queries to search the web.

    Visit relevant pages.

    Extract only verifiable information.

    Never invent data.

    Return null for unknown fields.

    Ignore duplicate companies.

    Prefer official company websites over third-party sources.

  expected_output: >
    A JSON object containing verified leads.

  agent: web_scraper

lead_enrichment_task:
  description: >
    Take the verified leads produced by the Lead Discovery Agent.

    For each lead:

    - Visit the official website.
    - Visit the About page.
    - Visit the Contact page.
    - Visit the requested social platforms.
    - Extract any missing business information.
    - Improve the company description using only verified information.
    - Expand the services list only when explicitly mentioned.

    Rules:

    - Never invent information.
    - Never replace verified fields with guesses.
    - Return null for missing values.
    - Preserve existing data.
    - Ignore unrelated websites.
    - Ignore duplicate companies.

  expected_output: >
    A JSON object containing enriched leads using the LeadCollection schema.

  agent: lead_enricher
