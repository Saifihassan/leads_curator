query_creation_task:
  description: >
    Based strictly on the user's request: "{user_query}", create exactly 20 highly specialized search queries.
    CRITICAL: You must ONLY target the specific platforms (e.g., LinkedIn, Instagram, X) and the specific locations requested by the user. Do not include platforms or locations that were not asked for.
  expected_output: >
    A list of 20 advanced search queries formatted as bullet points tailored exactly to the user's request.
  agent: query_creator

data_scraping_task:
  description: >
    Use the 20 specialized queries provided by the query creator to search the web and scrape the relevant information.
    CRITICAL: Extract data strictly matching the criteria from the user's request: "{user_query}". Only extract profiles for the requested platforms and locations.
  expected_output: >
    A structured report detailing each lead found, along with their respective social media profiles and contact information, ensuring it strictly matches the user's requested platforms.
  agent: web_scraper
